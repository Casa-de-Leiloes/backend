name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: auction_house_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://auction:auction@localhost:5432/auction_house_test

      - name: Run migrations
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://auction:auction@localhost:5432/auction_house_test

      - name: Lint
        run: bunx biome check .

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bunx jest --config jest.config.ts --passWithNoTests --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://auction:auction@localhost:5432/auction_house_test
          REDIS_URL: redis://localhost:6379
          FERNET_KEYS: ${{ secrets.FERNET_KEYS }}
          EMAIL_LOOKUP_KEY: ${{ secrets.EMAIL_LOOKUP_KEY }}
          PSEUDONYM_KEY: ${{ secrets.PSEUDONYM_KEY }}
          AUDIT_SIGNING_KEY: ${{ secrets.AUDIT_SIGNING_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: http://localhost:3000
          PASSKEY_RP_ID: localhost
          PASSKEY_ORIGIN: http://localhost:3000
          FRONTEND_ORIGIN: http://localhost:5173

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: postgresql://auction:auction@localhost:5432/auction_house_test
